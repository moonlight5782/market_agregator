name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/moldova_commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/scraper/requirements.txt
      - run: python -m compileall services/scraper
