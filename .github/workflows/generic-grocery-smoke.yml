name: Generic grocery smoke

on:
  pull_request:
    paths:
      - "services/scraper/**"
      - ".github/workflows/generic-grocery-smoke.yml"
  push:
    branches: [main]
    paths:
      - "services/scraper/**"
      - ".github/workflows/generic-grocery-smoke.yml"

jobs:
  linella-generic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: |
          pip install -r services/scraper/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Crawl Linella using only generic unknown-store path
        run: |
          timeout 360s python -m services.scraper.run \
            --url https://linella.md/ro \
            --slug linella-generic \
            --limit 25 \
            --browser-threshold 0.8 \
            --accept-partial
      - name: Validate smoke semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/reports/linella-generic.json').read_text())
          assert report['quality']['unique_products'] > 0
          assert report['outcome'] in {'PARTIAL', 'OK'}
          if report['outcome'] == 'OK':
              assert report['publish_readiness']['ready'] is True
          else:
              assert report['publish_readiness']['ready'] is False
          print('Linella smoke semantics valid:', report['outcome'], report['publish_readiness'])
          PY
      - name: Upload generic grocery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linella-generic-report
          path: |
            data/reports/linella-generic.json
            data/raw/linella-generic.ndjson
          if-no-files-found: warn
          retention-days: 7
