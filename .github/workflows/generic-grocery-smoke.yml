name: Generic multi-store smoke

on:
  pull_request:
    paths:
      - "services/scraper/**"
      - "data/store-registry.json"
      - ".github/workflows/generic-grocery-smoke.yml"
  push:
    branches: [main]
    paths:
      - "services/scraper/**"
      - "data/store-registry.json"
      - ".github/workflows/generic-grocery-smoke.yml"
  workflow_dispatch:

jobs:
  generic-store:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linella
            slug: linella-generic
            url: https://linella.md/ro
          - name: Cactus
            slug: cactus-generic
            url: https://www.cactus.md
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: |
          pip install -r services/scraper/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Crawl ${{ matrix.name }} using only generic unknown-store path
        run: |
          timeout 360s python -m services.scraper.run \
            --url "${{ matrix.url }}" \
            --slug "${{ matrix.slug }}" \
            --limit 25 \
            --browser-threshold 0.8 \
            --accept-partial
      - name: Validate multi-store smoke semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          slug = "${{ matrix.slug }}"
          report = json.loads(Path(f"data/reports/{slug}.json").read_text())
          assert report['quality']['unique_products'] > 0, f"{slug}: no products discovered"
          assert report['outcome'] in {'PARTIAL', 'OK'}
          if report['outcome'] == 'OK':
              assert report['publish_readiness']['ready'] is True
          else:
              assert report['publish_readiness']['ready'] is False
          print(slug, 'generic smoke valid:', report['outcome'], report['publish_readiness'])
          PY
      - name: Upload ${{ matrix.name }} generic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-${{ matrix.slug }}-report
          path: |
            data/reports/${{ matrix.slug }}.json
            data/raw/${{ matrix.slug }}.ndjson
          if-no-files-found: warn
          retention-days: 7
