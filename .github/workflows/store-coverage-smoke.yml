name: Store coverage smoke

on:
  push:
    branches:
      - agent/scraper-health
    paths:
      - '.github/workflows/store-coverage-smoke.yml'
      - 'services/scraper/**'
      - 'data/store-registry.json'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Unique products per store for smoke validation'
        required: false
        default: '25'

jobs:
  coverage-smoke:
    strategy:
      fail-fast: false
      matrix:
        store: [darwin, maximum, cactus, supraten]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install scraper dependencies
        run: |
          pip install -r services/scraper/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Crawl ${{ matrix.store }} with bounded smoke timeout
        shell: bash
        run: |
          set +e
          LIMIT="${{ github.event.inputs.limit || '25' }}"
          mkdir -p data/reports data/raw

          timeout --signal=TERM 300s python -m services.scraper.run \
            --store "${{ matrix.store }}" \
            --limit "$LIMIT" \
            --browser-threshold 0.8
          crawl_code=$?

          if [ -f "data/reports/${{ matrix.store }}.json" ]; then
            python -m services.scraper.coverage_audit \
              --stores "${{ matrix.store }}" \
              --output "data/reports/${{ matrix.store }}-coverage-audit.json"
            audit_code=$?
          else
            audit_code=0
          fi

          case "$crawl_code" in
            0)
              echo "${{ matrix.store }} smoke crawl succeeded"
              ;;
            4)
              echo "::warning title=${{ matrix.store }} origin unavailable::Crawler returned zero products / BLOCKED_BY_ORIGIN. This is retained as a coverage diagnostic and does not fail scraper CI."
              ;;
            124)
              echo "::error title=${{ matrix.store }} smoke timeout::Crawl exceeded 300 seconds"
              exit 124
              ;;
            *)
              echo "::error title=${{ matrix.store }} scraper failure::Crawler exited with code $crawl_code"
              exit "$crawl_code"
              ;;
          esac

          # Coverage audit remains diagnostic in smoke CI. Release/readiness gates
          # should enforce required-store coverage separately.
          if [ "$audit_code" -ne 0 ]; then
            echo "::warning title=${{ matrix.store }} coverage audit::Coverage audit exited with code $audit_code; report retained for readiness diagnostics."
          fi

          exit 0
      - name: Upload ${{ matrix.store }} reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-coverage-${{ matrix.store }}-${{ github.run_id }}
          path: |
            data/reports/${{ matrix.store }}*.json
            data/raw/${{ matrix.store }}.ndjson
          if-no-files-found: warn
          retention-days: 7
